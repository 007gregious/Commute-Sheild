version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: commuteshield_db
    environment:
      POSTGRES_USER: shield_user
      POSTGRES_PASSWORD: shield_password
      POSTGRES_DB: commuteshield_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: commuteshield_cache
    ports:
      - "6379:6379"
      
volumes:
  pgdata: